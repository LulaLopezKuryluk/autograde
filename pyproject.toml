[project]
name = "autograde"
version = "0.1.0"
description = "Python CLI tool to validate GitHub repositories"
requires-python = ">=3.8"
dependencies = [
    "gitpython>=3.1.0",
]

[project.scripts]
autograde = "autograde.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
